<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--h1:#27348B;--h2:#4658D0;--bg:#F4F6FB;--sf:#fff;--tx:#161B3A;--mu:#566083;--ln:#D9DDEE;--pr:#27348B;--pt:#fff;--ac:#E8A200;--ok:#0E8A66;--wn:#9A6700;--er:#B83227;--soft:#E8ECFA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--h1:#2B3478;--h2:#3D4AA6;--bg:#0F1226;--sf:#181C38;--tx:#ECEEFB;--mu:#A0A7CC;--ln:#2D3258;--pr:#93A0FF;--pt:#10142E;--ac:#F2B429;--ok:#3FCB9F;--wn:#E5B04A;--er:#FF8777;--soft:#232951}}
:root[data-theme=dark]{--h1:#2B3478;--h2:#3D4AA6;--bg:#0F1226;--sf:#181C38;--tx:#ECEEFB;--mu:#A0A7CC;--ln:#2D3258;--pr:#93A0FF;--pt:#10142E;--ac:#F2B429;--ok:#3FCB9F;--wn:#E5B04A;--er:#FF8777;--soft:#232951}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Mukta,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.2;font-weight:800;margin:0 0 6px}h2{font-size:19px;font-weight:800;margin:0 0 8px}h3{font-size:16px;font-weight:600;margin:12px 0 0}
p{margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:14px}.er{color:var(--er);min-height:1.5em;font-weight:600}.lead{font-size:18px}.logo{font-size:40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--pr);background:var(--pr);color:var(--pt);font-weight:600;cursor:pointer}
.btn.o{background:transparent;color:var(--pr)}.btn.w{width:100%}.btn.s{min-height:40px;padding:0 12px;font-size:14px}.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;min-height:46px;padding:8px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ln);background:var(--sf);cursor:pointer}
.chip[aria-pressed=true]{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}.bar.g i{background:var(--ok)}
.road{display:flex;gap:4px;margin:4px 0}.road i{flex:1;min-width:6px;height:12px;border-radius:6px;background:var(--soft);border:1px solid var(--ln)}
.road.lg{margin:8px 0 20px}.road.lg i{height:18px}
.road i.done{background:var(--ok);border-color:var(--ok)}.road i.partial{background:var(--ac);border-color:var(--ac)}.road i.incomplete{background:var(--er);border-color:var(--er)}
.tk{border-left:5px solid var(--ln)}.tk.done{border-left-color:var(--ok)}.tk.partial{border-left-color:var(--ac)}.tk.incomplete{border-left-color:var(--er)}
.rw{margin:0 0 6px;padding-left:8px;border-left:4px solid var(--ln)}.rw.done{border-left-color:var(--ok)}
.pri.High{color:var(--er);font-weight:600}.pri.Medium{color:var(--wn)}.pri.Low{color:var(--mu)}
.seg{display:flex;border:1.5px solid var(--ln);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;border-left:1px solid var(--ln);background:var(--sf);font-weight:600;cursor:pointer}.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--pr);color:var(--pt)}
.note{border-left:4px solid var(--ac);background:var(--soft);padding:10px 12px;border-radius:8px;font-size:15px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft)}.tag.ok{background:var(--ok);color:var(--pt)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stats b{display:block;font-size:20px}.stats span{font-size:13px;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}.wd{font-size:13px;color:var(--mu)}
.cd{min-height:44px;border:1.5px solid transparent;border-radius:10px;background:none;position:relative;cursor:pointer}
.cd i{position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%}.cd i.has{background:var(--pr)}.cd i.ok{background:var(--ok)}
.cd.now{border-color:var(--ac)}.cd.sel{background:var(--pr);color:var(--pt)}.cd.sel i{background:var(--pt)!important}
.chart{display:flex;gap:6px;align-items:flex-end;height:140px;margin-top:8px}.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bars{flex:1;width:100%;display:flex;gap:2px;align-items:flex-end}.bars i{flex:1;border-radius:4px 4px 0 0;min-height:2px}.pl{background:var(--soft);border:1px solid var(--ln)}.cp{background:var(--pr)}
details>summary{cursor:pointer;min-height:44px}dt{font-weight:600}dd{margin:0 0 6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer}
nav button[aria-current=page]{color:var(--pr);box-shadow:inset 0 3px var(--pr)}
.dot{background:var(--er);color:var(--pt);border-radius:99px;padding:0 6px;font-size:12px}
#sh{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:flex-end;z-index:20}#sh.on{display:flex}
#shb{background:var(--sf);width:100%;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#ts{position:fixed;left:16px;right:16px;bottom:80px;max-width:520px;margin:0 auto;padding:10px 14px;border-radius:12px;background:var(--tx);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#ts.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body.lv{padding-bottom:164px}.card .card{border:0;padding:0;margin:0}.stack{display:grid;gap:8px;margin-top:12px}
nav svg{width:22px;height:22px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:18px;margin:0 0 14px;box-shadow:0 8px 24px rgba(39,52,139,.22)}
.hero h1{color:#fff;font-size:24px;margin:0 0 2px}.hero p{margin:0 0 4px;opacity:.92}.pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:600}
.ring{width:96px;height:96px;flex:none}.ring circle{fill:none;stroke-width:10}.ring .t{stroke:rgba(255,255,255,.22)}.ring .v{stroke:#FFC94A;stroke-linecap:round}
.ring text{fill:#fff;font:800 22px Mukta,system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.wk button{min-height:64px;border:1.5px solid var(--ln);border-radius:14px;background:var(--sf);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.wk b{font-size:18px}.wk i{width:6px;height:6px;border-radius:50%}.wk i.has{background:var(--pr)}.wk button.sel{background:var(--pr);color:var(--pt);border-color:var(--pr)}.wk button.sel i.has{background:var(--pt)}.wk button.now{border-color:var(--ac)}.wk span{color:inherit;opacity:.75}
.next{border:2px solid var(--pr)}.next .btn{width:100%;margin-top:10px}
.trow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.trow:last-child{border:0}.trow .m{flex:1;min-width:0}.trow .m b,.trow .m span{display:block;overflow-wrap:anywhere}
.chk{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--ln);background:var(--sf);color:var(--pt);font-size:20px;font-weight:800;cursor:pointer}
.chk.done{background:var(--ok);border-color:var(--ok)}.chk.partial{background:var(--ac);border-color:var(--ac)}.chk.incomplete{background:var(--er);border-color:var(--er)}
.more{min-width:44px;min-height:44px;border:0;background:none;font-size:24px;color:var(--mu);cursor:pointer}
.live{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.live .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.live small{display:block;opacity:.8;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .btn{margin-left:auto;background:#FF7A6B;border-color:#FF7A6B;color:#10142E}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nv" hidden aria-label="Main"></nav>
<div id="sh" role="dialog" aria-modal="true"><div id="shb"></div></div>
<div id="ts" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date());
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const okD=k=>/^\d{4}-\d{2}-\d{2}$/.test(k||'')&&dk(pd(k))===k;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fD=k=>pd(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m'};
const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(a,f)=>a.reduce((x,t)=>x+f(t),0);
const P={High:0,Medium:1,Low:2},DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const RES=['Video lectures','Standard textbooks','Question bank (QBank)','Own notes','Previous-year papers','Mock test series','Flashcards'];
// Add a new exam by adding one entry here: name, subjects, suggested full-mock length in minutes.
const EX={
 neetpg:{n:'NEET PG',mock:210,sub:['Anatomy','Physiology','Biochemistry','Pathology','Pharmacology','Microbiology','Forensic Medicine','Community Medicine (PSM)','Medicine','Surgery','Obstetrics & Gynaecology','Paediatrics','ENT','Ophthalmology','Orthopaedics','Dermatology','Psychiatry','Radiology','Anaesthesia']},
 sscgl:{n:'SSC CGL',mock:60,sub:['Quantitative Aptitude','Reasoning','English','General Awareness']},
 upsc:{n:'UPSC CSE',mock:240,sub:['Polity','History','Geography','Economy','Environment','Science & Tech','Current Affairs','CSAT']},
 neetug:{n:'NEET UG',mock:200,sub:['Physics','Chemistry','Botany','Zoology']}};
// NEET SS (surgical). Topics are suggested from standard textbook chapter headings: check them against the official NBEMS syllabus.
EX.neetss={n:'NEET SS (Surgical)',mock:180,t:{
'Perioperative and critical care':['Fluids, electrolytes and acid-base','Shock and resuscitation','Surgical nutrition','Sepsis, SIRS and organ failure','Transfusion, coagulation and thromboprophylaxis','Antibiotics and surgical site infection'],
'Trauma, burns and wounds':['Polytrauma and ATLS principles','Head, chest and abdominal trauma','Burns resuscitation and care','Wound healing, grafts and scars','Diabetic foot and pressure ulcers'],
'Surgical gastroenterology':['Oesophagus: achalasia, GERD, carcinoma','Stomach and duodenum, bariatric surgery','Small bowel, appendix and obstruction','Colorectal: IBD, polyps, carcinoma','Anorectal disorders and fistulas','Hernias and abdominal wall'],
'HPB and transplant surgery':['Liver: abscess, cysts, tumours','Portal hypertension and liver failure','Biliary stones, strictures and cholangiocarcinoma','Pancreatitis and pseudocyst','Pancreatic and periampullary tumours','Transplantation basics'],
'Surgical oncology':['Cancer biology, staging and screening','Head and neck cancers','Breast cancer','Sarcoma, skin cancer and melanoma','Chemo-radiotherapy and targeted therapy basics','Oncologic emergencies and palliative care'],
'Endocrine surgery':['Thyroid nodules and carcinoma','Parathyroid and calcium disorders','Adrenal tumours and phaeochromocytoma','MEN syndromes and neuroendocrine tumours'],
'Urology':['Urolithiasis','BPH and prostate carcinoma','Bladder and renal tumours','Urinary infection and obstruction','Strictures, hypospadias and reflux','Renal transplantation and trauma'],
'Cardiothoracic and vascular surgery':['Valvular heart disease','Coronary artery disease and CABG','Congenital heart disease','Aortic disease and dissection','Peripheral arterial and venous disease','Lung cancer and thoracic surgery','Cardiopulmonary bypass'],
'Neurosurgery':['Head injury and raised ICP','Brain tumours','Spine: degenerative and trauma','Aneurysm, SAH and AVM','Hydrocephalus and paediatric neurosurgery','Functional and peripheral nerve surgery'],
'Paediatric surgery':['Oesophageal atresia and GI anomalies','Abdominal wall defects and diaphragmatic hernia','Hirschsprung disease and anorectal malformations','Biliary atresia and choledochal cyst','Paediatric tumours: Wilms, neuroblastoma','Paediatric urology'],
'Plastic and reconstructive surgery':['Flaps and grafts','Hand injuries and tendon repair','Cleft lip and palate, craniofacial','Burn reconstruction','Microsurgery and free tissue transfer'],
'Applied basic sciences and imaging':['Surgical anatomy: neck, abdomen, pelvis','Physiology of GI, endocrine and cardiac systems','Pathology of tumours and inflammation','Imaging choices: CT, MRI, ultrasound','Research methods and biostatistics']}};
EX.neetss.sub=Object.keys(EX.neetss.t);
const LK='aimsarthi:v1',fresh=()=>({p:{hours:4,workHrs:0,off:'',done:[],weak:[],res:[]},tasks:[],draft:null,sessions:[],timer:null,top:[]});
let S=null,ready=false,mode='local',ref=null,q=Promise.resolve(),sT,iv,tT,fromCloud=false;
let V={tab:'home',day:today(),wk:0,step:0,err:'',cal:today().slice(0,7),tt:'',st:'',lx:''};
const byId=id=>S.tasks.find(t=>t.id===id);
const doneMin=t=>t.status==='done'?t.mins:t.status==='partial'?Math.round(t.mins/2):0;
const remain=t=>t.status==='partial'?Math.max(5,t.mins-Math.round(t.mins/2)):t.mins;
const tasksOn=k=>S.tasks.filter(t=>t.date===k).sort((a,b)=>P[a.pri]-P[b.pri]||a.mins-b.mins);
const miss=()=>S.tasks.filter(t=>!t.resolved&&t.date<today()&&t.status!=='done');
const cap=()=>(+S.p.hours)*60;
const load=(k,x)=>sum(S.tasks.filter(t=>t.date===k),t=>t.mins)+((x&&x[k])||0);
const repl=t=>t.gen&&t.status==='todo'&&!t.history&&t.date>=today();
const wkDays=o=>{const d=pd(today());d.setDate(d.getDate()-(d.getDay()+6)%7+o*7);const s=dk(d);return[...Array(7)].map((_,i)=>addD(s,i))};
const chip=(a,k,v,on,l)=>`<button type="button" class="chip" data-a="${a}" data-k="${k}" data-v="${esc(v)}" aria-pressed="${!!on}">${esc(l||v)}</button>`;
const inp=(id,l,a)=>`<label for="${id}">${l}</label><input id="${id}" ${a}>`;

/* ---------- storage: private per-user doc in the artifact db, else this browser ---------- */
function setSt(t){V.st=t;const e=$('#st');if(e)e.textContent=t}
function ls(d){try{localStorage.setItem(LK,JSON.stringify(d));setSt('Saved on this device')}catch(e){setSt('Could not save: browser storage is unavailable.')}}
function save(){clearTimeout(sT);sT=setTimeout(flush,300)}
function flush(){q=q.then(async()=>{
 S.sessions=S.sessions.slice(-500);const data=JSON.parse(JSON.stringify(S));
 if(mode==='cloud'&&ref){try{await ref.set(data);setSt('Saved to your account')}
  catch(e){if(e&&e.code==='invalid_argument'){mode='local';ls(data);setSt('Saved on this device only (account storage is not allowed for you here)')}else setSt('Could not reach account storage. The next change will retry.')}}
 else ls(data)})}
async function boot(){
 render();
 try{if(window.claude){const[u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
  if(u&&d){const id=await u.id();ref=d.collection('data/users/'+id).doc('state');mode='cloud';const s=await ref.get();if(s.exists){S=JSON.parse(JSON.stringify(s.data()));fromCloud=true}}}}
 catch(e){ref=null;mode='local'}
 if(!S){try{S=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){}}
 S=Object.assign(fresh(),S||{});S.p=Object.assign(fresh().p,S.p);
 ready=true;if(S.timer)startTick();
 if(mode==='cloud'&&!fromCloud&&S.p.onboarded)save();
 render()}

/* ---------- plan generation (plain rules, no API) ---------- */
function gen(p){
 const ex=EX[p.exam],t0=today(),N=Math.min(28,diff(t0,addD(p.examDate,-1))+1),c=(+p.hours)*60,pm=c*.8;
 const nb=Math.max(1,Math.round(pm/60)),bl=Math.max(20,Math.round(pm/nb/5)*5),weak=p.weak||[],dn=p.done||[];
 let core=ex.sub.filter(s=>!dn.includes(s));if(!core.length)core=ex.sub.slice();
 const qu=[...core,...core.filter(s=>weak.includes(s))],cnt={},last={},out=[];let qi=0,cover=[];
 const mk=(date,s,t,m,pr,type)=>out.push({id:uid(),subject:s,topic:t,mins:m,pri:pr,date,type,status:'todo',gen:true});
 for(let i=0;i<N;i++){const d=addD(t0,i),k=i%7;if(k===0)cover=[];
  if(p.off!==''&&String(pd(d).getDay())===p.off)continue;
  if(k===5){[...new Set(cover)].slice(-nb).forEach(s=>mk(d,s,'Revise: '+(last[s]||'high-yield notes and recall'),bl,'Medium','revision'));
   if(dn.length)mk(d,dn[Math.floor(i/7)%dn.length],'Light revision of a completed subject',bl,'Low','revision')}
  else if(k===6){mk(d,'Mock test','Full-length mock for '+ex.n+' (adjust length to your paper)',ex.mock,'High','mock');mk(d,'Mock test','Analyse mistakes and note weak topics',60,'High','mock')}
  else for(let b=0;b<nb;b++){const s=qu[qi++%qu.length],tl=(ex.t||{})[s];cnt[s]=(cnt[s]||0)+1;const tp=tl?tl[(cnt[s]-1)%tl.length]:'Core concepts and MCQs, part '+cnt[s];last[s]=tp;cover.push(s);mk(d,s,tp,bl,weak.includes(s)?'High':'Medium','study')}}
 return{start:t0,tasks:out,at:new Date().toISOString()}}

/* ---------- onboarding ---------- */
function chk(s){const p=S.p;
 if(s===1){const n=(p.name||'').trim();return n&&n.length<=40?'':'Enter your name (up to 40 characters).'}
 if(s===2)return EX[p.exam]?'':'Choose an exam.';
 if(s===3){if(!okD(p.examDate))return'Enter a valid exam date.';const n=diff(today(),p.examDate);if(n<2)return'The exam date must be at least 2 days from today.';if(n>1100)return'The exam date must be within about 3 years.';const t=(p.target||'').trim();return t&&t.length<=80?'':'Enter a target score or rank (up to 80 characters).'}
 if(s===4){const h=+p.hours,w=+p.workHrs;if(!(h>=.5&&h<=16))return'Daily study hours must be between 0.5 and 16.';return w>=0&&w<=16?'':'Work hours must be between 0 and 16.'}
 if(s===5)return p.level?'':'Choose your current level.';
 if(s===6)return(p.resOther||'').length>120?'Keep other resources under 120 characters.':'';
 return''}
function wiz(){const p=S.p,s=V.step;
 if(!s)return`<section><div class="road lg" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="partial"></i><i class="done"></i><i></i><i></i><i></i></div><h1 class="logo">AimSarthi</h1><p class="lead">Your study guide from today to exam day. Build a realistic roadmap, track study time, keep a streak, and recover from missed days without piling everything onto tomorrow.</p><p class="note">Built first for NEET PG aspirants who are also doing an internship. NEET SS (surgical specialities), SSC CGL, UPSC CSE and NEET UG are included too. Plans are suggestions from your answers, not verified advice, and cannot promise any score or rank.</p><button class="btn w" style="margin-top:16px" data-a="next">Get started</button></section>`;
 const T=['','Create your profile','Choose your exam','Exam date and target','Daily time and commitments','Where you stand','Study resources'][s];let b='';
 if(s===1)b=`<p class="note">${mode==='cloud'?'You are signed in with your Claude account. Your plan is saved privately to that account and AimSarthi never sees a password.':'There are no accounts in this version, so your plan is saved on this device only. Clearing browser data erases it. When you return, your saved plan loads automatically.'}</p>`+inp('w_n','Your name',`data-f="name" maxlength="40" autocomplete="given-name" value="${esc(p.name||'')}"`);

  const D=S.tasks.filter(z=>z.date===k);if(D.some(z=>z.type==='mock'))continue;
  if(load(k,x)+m>cap()||(x&&(x[k]||0)+m>rc))continue;
  r.push([k,load(k,x)-(t&&D.some(z=>z.subject===t.subject)?30:0)-(t&&t.type==='revision'&&D.some(z=>z.type==='revision')?40:0)])}
 return r.sort((a,b)=>a[1]-b[1]||(a[0]<b[0]?-1:1)).map(z=>z[0])}
function moveT(t,k,m){const h={from:t.date,to:k,at:new Date().toISOString()};
 if(t.status==='partial'){t.resolved=true;const n={...t,id:uid(),date:k,mins:m,status:'todo',resolved:false,history:[h],gen:false};delete n.doneDate;S.tasks.push(n)}
 else{t.history=(t.history||[]).concat(h);t.date=k;t.mins=m;t.status='todo'}}
function rsp(){const m=+$('#r_m').value,k=$('#r_d').value,e=$('#rp');if(!e)return;
 if(!okD(k)||!(m>=5&&m<=600)){e.textContent='Enter a valid date and duration to preview the workload.';return}
 const a=load(k),b=a+m,c=cap();let h=`<b>${fD(k)}</b>: ${hm(a)} planned now, <b>${hm(b)}</b> after this move (limit ${hm(c)}). `;
 if(b>c){const alt=bestDays(m).filter(x=>x!==k).slice(0,2);h+=`That is ${hm(b-c)} over your limit. Options: `+(alt.map(x=>`<button class="btn o s" data-a="pickd" data-v="${x}">${fD(x)} (${hm(c-load(x))} free)</button>`).join(' ')||'no day in the next 2 weeks has room. ')+(c-a>=15?` <button class="btn o s" data-a="fit" data-v="${Math.floor((c-a)/5)*5}">Shorten to ${hm(Math.floor((c-a)/5)*5)}</button>`:'')}
 else h+='This fits your daily limit.';e.innerHTML=h}

/* ---------- actions ---------- */
const A={
 tab:d=>{V.tab=d.v;scrollTo(0,0);render()},
 next:()=>{const e=chk(V.step);if(e){V.err=e;render();return}V.err='';
  if(V.step<6){V.step++;save();render();scrollTo(0,0)}
  else{S.p.hours=+S.p.hours;S.p.workHrs=+S.p.workHrs;S.p.onboarded=true;S.draft=gen(S.p);V.tab='roadmap';save();render();scrollTo(0,0)}},
 back:()=>{V.err='';V.step=Math.max(0,V.step-1);render()},
 pick:d=>{if(d.k==='exam'&&S.p.exam!==d.v){S.p.done=[];S.p.weak=[]}S.p[d.k]=d.v;render()},
 tg:d=>{const a=S.p[d.k]=S.p[d.k]||[],i=a.indexOf(d.v);i<0?a.push(d.v):a.splice(i,1);
  if(i<0&&d.k==='done')S.p.weak=(S.p.weak||[]).filter(x=>x!==d.v);if(i<0&&d.k==='weak')S.p.done=(S.p.done||[]).filter(x=>x!==d.v);render()},
 redo:()=>{S.p.onboarded=false;V.step=2;save();render()},
 regen:()=>{S.draft=gen(S.p);V.tab='roadmap';save();render()},
 accept:()=>{const d=S.draft;S.tasks=S.tasks.filter(t=>!repl(t)).concat(d.tasks);S.p.planStart=d.start;S.draft=null;V.tab='home';V.day=today();save();render();toast('Roadmap accepted')},
 day:d=>{V.day=d.v;render()},
 cm:d=>{const[y,m]=V.cal.split('-').map(Number),x=new Date(y,m-1+(+d.v),1);V.cal=x.getFullYear()+'-'+pad(x.getMonth()+1);render()},
 st:d=>{const t=byId(d.id);t.status=t.status===d.v?'todo':d.v;if(t.status==='done'||t.status==='partial')t.doneDate=today();else delete t.doneDate;save();render()},
 x:closeSheet,
 go:d=>{if(S.timer)A.timer();S.timer={start:new Date().toISOString(),taskId:d.id||''};startTick();closeSheet();save();render();toast('Timer started')},
 tm:d=>{const t=byId(d.id);sheet(`<h2>${esc(t.subject)}</h2><p class="mu">${esc(t.topic)}</p><div class="stack"><button class="btn" data-a="go" data-id="${t.id}">Start studying this</button><button class="btn o" data-a="st2" data-id="${t.id}" data-v="partial">Partly done</button><button class="btn o" data-a="st2" data-id="${t.id}" data-v="incomplete">Not done</button><button class="btn o" data-a="del" data-id="${t.id}">Delete task</button><button class="btn o" data-a="x">Close</button></div>`)},
 st2:d=>{const t=byId(d.id);t.status=t.status===d.v?'todo':d.v;if(t.status==='done'||t.status==='partial')t.doneDate=today();else delete t.doneDate;closeSheet();save();render()},
 add:()=>sheet(`<h2>Add task</h2>${inp('t_s','Subject',`list="sl" maxlength="60"`)}<datalist id="sl">${EX[S.p.exam].sub.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>${inp('t_t','Topic','maxlength="100"')}${inp('t_m','Estimated minutes (5 to 600)','type="number" inputmode="numeric" min="5" max="600" step="5" value="60"')}<label for="t_p">Priority</label><select id="t_p"><option>High</option><option selected>Medium</option><option>Low</option></select>${inp('t_d','Scheduled date',`type="date" min="${today()}" max="${S.p.examDate}" value="${V.day<today()?today():V.day}"`)}<p id="se" class="er" role="alert"></p><div class="row"><button class="btn o" data-a="x">Cancel</button><button class="btn" style="flex:1" data-a="addok">Save task</button></div>`),
 addok:()=>{const s=$('#t_s').value.trim(),t=$('#t_t').value.trim(),m=+$('#t_m').value,d=$('#t_d').value;
  const e=!s?'Enter a subject.':!t?'Enter a topic.':!(Number.isInteger(m)&&m>=5&&m<=600)?'Duration must be a whole number from 5 to 600 minutes.':(!okD(d)||d<today()||d>S.p.examDate)?'Pick a date from today up to your exam date.':'';
  if(e){$('#se').textContent=e;return}
  S.tasks.push({id:uid(),subject:s,topic:t,mins:m,pri:$('#t_p').value,date:d,type:'study',status:'todo'});closeSheet();save();render();toast('Task added')},
 del:d=>sheet(`<h2>Delete this task?</h2><p>${esc(byId(d.id).subject)}: ${esc(byId(d.id).topic)}. This cannot be undone.</p><div class="row"><button class="btn o" style="flex:1" data-a="x">Keep it</button><button class="btn" style="flex:1" data-a="delok" data-id="${d.id}">Delete</button></div>`),
 delok:d=>{S.tasks=S.tasks.filter(t=>t.id!==d.id);closeSheet();save();render();toast('Task deleted')},
 timer:()=>{if(S.timer){const s=new Date(S.timer.start),m=Math.min(720,Math.round((Date.now()-s)/6e4));
   if(m<1)toast('Under a minute, so it was not logged.');else{S.sessions.push({id:uid(),start:s.toISOString(),end:new Date().toISOString(),day:dk(s),mins:m,taskId:S.timer.taskId});toast('Saved '+hm(m)+' of study')}
   S.timer=null;clearInterval(iv)}else{S.timer={start:new Date().toISOString(),taskId:V.tt};startTick()}save();render()},
 rs:d=>{const t=byId(d.id),r=remain(t),best=bestDays(r,0,t)[0]||addD(today(),1);V.rs=t.id;
  sheet(`<h2>Reschedule task</h2><p>${esc(t.subject)}: ${esc(t.topic)}</p>${t.status==='partial'?'<p class="sm mu">Part of this task is done. The unfinished part becomes a new task and your partial credit stays.</p>':''}${inp('r_m','Minutes to schedule (5 to 600)',`type="number" inputmode="numeric" min="5" max="600" step="5" data-g="rs" value="${r}"`)}${inp('r_d','New date',`type="date" data-g="rs" min="${today()}" max="${addD(S.p.examDate,-1)}" value="${best}"`)}<div id="rp" class="note" style="margin-top:12px"></div><p id="se" class="er" role="alert"></p><div class="row"><button class="btn o" data-a="x">Cancel</button><button class="btn" style="flex:1" data-a="rsok">Move task</button></div>`);rsp()},
 pickd:d=>{$('#r_d').value=d.v;rsp()},fit:d=>{$('#r_m').value=d.v;rsp()},
 rsok:()=>{const t=byId(V.rs),m=+$('#r_m').value,k=$('#r_d').value;
  if(!(Number.isInteger(m)&&m>=5&&m<=600)||!okD(k)||k<today()||k>=S.p.examDate){$('#se').textContent='Choose a date from today to the day before your exam, and 5 to 600 minutes.';return}
  moveT(t,k,m);closeSheet();save();render();toast('Moved to '+fD(k))},
 skip:d=>{byId(d.id).resolved=true;save();render();toast('Dismissed. The task stays on its original day.')},
 sug:()=>{const M=miss().sort((a,b)=>P[a.pri]-P[b.pri]||(a.date<b.date?-1:1)),add={},pl=[],un=[],sk=[];
  M.forEach(t=>{const r=remain(t);let m=r,d=bestDays(m,add,t)[0];if(!d&&r>30){m=Math.max(20,Math.round(r/2/5)*5);d=bestDays(m,add,t)[0]}
   if(d){add[d]=(add[d]||0)+m;pl.push({id:t.id,d,m,r})}else if(t.pri==='Low'||t.type==='revision')sk.push(t);else un.push(t)});
  V.pl=pl;V.sk=sk.map(t=>t.id);
  sheet(`<h2>Suggested recovery plan</h2><p class="sm mu">A suggestion only. Nothing moves until you accept. It spreads work across days, keeps mock days clear, groups related subjects, and trims low-priority items last.</p>`+(pl.length?pl.map(x=>{const t=byId(x.id);return`<p><b>${esc(t.subject)}</b>: ${esc(t.topic)}<br><span class="sm">${fD(t.date)} to <b>${fD(x.d)}</b>, ${hm(x.m)}${x.m<x.r?' (shortened from '+hm(x.r)+')':''}</span></p>`}).join('')+`<p class="sm"><b>Workload after:</b> ${Object.keys(add).sort().map(k=>fD(k)+' '+hm(load(k)+add[k])+' of '+hm(cap())).join('; ')}</p>`:'<p>No task fits the next two weeks without going over your daily limit.</p>')+(sk.length?`<p class="sm"><b>Suggest dismissing (${sk.length}):</b> ${sk.map(t=>esc(t.subject)).join(', ')}. They stay in your history, and you can still reschedule them by hand.</p>`:'')+(un.length?`<p class="sm">${un.length} not placed. Reschedule them yourself.</p>`:'')+`<div class="row"><button class="btn o" style="flex:1" data-a="x">Reject</button>${pl.length||sk.length?'<button class="btn" style="flex:1" data-a="sugok">Accept plan</button>':''}</div>`)},
 sugok:()=>{const n=V.pl.length,s=V.sk.length;V.pl.forEach(x=>moveT(byId(x.id),x.d,x.m));V.sk.forEach(id=>{byId(id).resolved=true});V.pl=[];V.sk=[];closeSheet();save();render();toast(n+' moved, '+s+' dismissed')},
 wk:d=>{V.wk+=+d.v;render()},
 lx:d=>{V.lx=d.v;render()},
 te:()=>sheet(`<h2>Add a source-based entry</h2><p class="sm mu">Only record what the source states. Do not fill gaps from memory.</p>${inp('e_n','Candidate name','maxlength="60"')}${inp('e_y','Exam year',`type="number" inputmode="numeric" min="1990" max="${new Date().getFullYear()}"`)}${inp('e_d','Reported preparation duration','maxlength="60"')}${inp('e_r','Reported resources','maxlength="200"')}${inp('e_mo','Reported months of preparation (optional)','type="number" inputmode="numeric" min="0" max="60"')}${inp('e_hr','Reported study hours per day (optional)','type="number" inputmode="decimal" step="0.5" min="0" max="16"')}${inp('e_v','Revision approach','maxlength="200"')}${inp('e_s','Source (link or full citation)','maxlength="300"')}<p id="se" class="er" role="alert"></p><div class="row"><button class="btn o" data-a="x">Cancel</button><button class="btn" style="flex:1" data-a="teok">Save entry</button></div>`),
 teok:()=>{const g=i=>$(i).value.trim(),n=g('#e_n'),y=+g('#e_y'),s=g('#e_s');
  const e=!n?'Enter the candidate name.':!(Number.isInteger(y)&&y>=1990&&y<=new Date().getFullYear())?'Enter a valid exam year.':s.length<8?'Add a source link or full citation so others can verify it.':'';
  if(e){$('#se').textContent=e;return}
  S.top.push({id:uid(),exam:V.lx||S.p.exam,name:n,year:y,dur:g('#e_d'),res:g('#e_r'),rev:g('#e_v'),mo:Math.min(60,Math.max(0,+g('#e_mo')||0)),hr:Math.min(16,Math.max(0,+g('#e_hr')||0)),src:s,checked:false});closeSheet();save();render()},
 tc:d=>{const e=S.top.find(x=>x.id===d.id);e.checked=!e.checked;save();render()},
 tr:d=>{S.top=S.top.filter(x=>x.id!==d.id);save();render()},
 reset:()=>sheet(`<h2>Start over?</h2><p>This erases your profile, roadmap, tasks and study sessions.</p><div class="row"><button class="btn o" style="flex:1" data-a="x">Cancel</button><button class="btn" style="flex:1" data-a="resetok">Erase everything</button></div>`),
 resetok:()=>{S=fresh();V.step=0;V.tab='home';clearInterval(iv);closeSheet();save();render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset);else if(e.target.id==='sh')closeSheet()});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f,g=t.dataset.g;if(f&&S)S.p[f]=t.value;if(g==='rs')rsp();if(g==='tt')V.tt=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
boot();
</script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
