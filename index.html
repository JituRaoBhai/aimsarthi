<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AimSarthi</title>
<meta name="theme-color" content="#27348B">
<meta name="description" content="Study roadmap, daily tracker and missed-task recovery for competitive exams.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AimSarthi">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--bg:#F4F6FB;--sf:#fff;--tx:#161B3A;--mu:#566083;--ln:#D9DDEE;--pr:#27348B;--pt:#fff;--ac:#E8A200;--ok:#0E8A66;--wn:#9A6700;--er:#B83227;--soft:#E8ECFA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1226;--sf:#181C38;--tx:#ECEEFB;--mu:#A0A7CC;--ln:#2D3258;--pr:#93A0FF;--pt:#10142E;--ac:#F2B429;--ok:#3FCB9F;--wn:#E5B04A;--er:#FF8777;--soft:#232951}}
:root[data-theme=dark]{--bg:#0F1226;--sf:#181C38;--tx:#ECEEFB;--mu:#A0A7CC;--ln:#2D3258;--pr:#93A0FF;--pt:#10142E;--ac:#F2B429;--ok:#3FCB9F;--wn:#E5B04A;--er:#FF8777;--soft:#232951}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Mukta,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.2;font-weight:800;margin:0 0 6px}h2{font-size:19px;font-weight:800;margin:0 0 8px}h3{font-size:16px;font-weight:600;margin:12px 0 0}
p{margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:14px}.er{color:var(--er);min-height:1.5em;font-weight:600}.lead{font-size:18px}.logo{font-size:40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--pr);background:var(--pr);color:var(--pt);font-weight:600;cursor:pointer}
.btn.o{background:transparent;color:var(--pr)}.btn.w{width:100%}.btn.s{min-height:40px;padding:0 12px;font-size:14px}.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;min-height:46px;padding:8px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ln);background:var(--sf);cursor:pointer}
.chip[aria-pressed=true]{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}.bar.g i{background:var(--ok)}
.road{display:flex;gap:4px;margin:4px 0}.road i{flex:1;min-width:6px;height:12px;border-radius:6px;background:var(--soft);border:1px solid var(--ln)}
.road.lg{margin:8px 0 20px}.road.lg i{height:18px}
.road i.done{background:var(--ok);border-color:var(--ok)}.road i.partial{background:var(--ac);border-color:var(--ac)}.road i.incomplete{background:var(--er);border-color:var(--er)}
.tk{border-left:5px solid var(--ln)}.tk.done{border-left-color:var(--ok)}.tk.partial{border-left-color:var(--ac)}.tk.incomplete{border-left-color:var(--er)}
.rw{margin:0 0 6px;padding-left:8px;border-left:4px solid var(--ln)}.rw.done{border-left-color:var(--ok)}
.pri.High{color:var(--er);font-weight:600}.pri.Medium{color:var(--wn)}.pri.Low{color:var(--mu)}
.seg{display:flex;border:1.5px solid var(--ln);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;border-left:1px solid var(--ln);background:var(--sf);font-weight:600;cursor:pointer}.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--pr);color:var(--pt)}
.note{border-left:4px solid var(--ac);background:var(--soft);padding:10px 12px;border-radius:8px;font-size:15px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft)}.tag.ok{background:var(--ok);color:var(--pt)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stats b{display:block;font-size:20px}.stats span{font-size:13px;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}.wd{font-size:13px;color:var(--mu)}
.cd{min-height:44px;border:1.5px solid transparent;border-radius:10px;background:none;position:relative;cursor:pointer}
.cd i{position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%}.cd i.has{background:var(--pr)}.cd i.ok{background:var(--ok)}
.cd.now{border-color:var(--ac)}.cd.sel{background:var(--pr);color:var(--pt)}.cd.sel i{background:var(--pt)!important}
.chart{display:flex;gap:6px;align-items:flex-end;height:140px;margin-top:8px}.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bars{flex:1;width:100%;display:flex;gap:2px;align-items:flex-end}.bars i{flex:1;border-radius:4px 4px 0 0;min-height:2px}.pl{background:var(--soft);border:1px solid var(--ln)}.cp{background:var(--pr)}
details>summary{cursor:pointer;min-height:44px}dt{font-weight:600}dd{margin:0 0 6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer}
nav button[aria-current=page]{color:var(--pr);box-shadow:inset 0 3px var(--pr)}
.dot{background:var(--er);color:var(--pt);border-radius:99px;padding:0 6px;font-size:12px}
#sh{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:flex-end;z-index:20}#sh.on{display:flex}
#shb{background:var(--sf);width:100%;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#ts{position:fixed;left:16px;right:16px;bottom:80px;max-width:520px;margin:0 auto;padding:10px 14px;border-radius:12px;background:var(--tx);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#ts.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nv" hidden aria-label="Main"></nav>
<div id="sh" role="dialog" aria-modal="true"><div id="shb"></div></div>
<div id="ts" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date());
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const okD=k=>/^\d{4}-\d{2}-\d{2}$/.test(k||'')&&dk(pd(k))===k;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fD=k=>pd(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m'};
const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(a,f)=>a.reduce((x,t)=>x+f(t),0);
const P={High:0,Medium:1,Low:2},DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const RES=['Video lectures','Standard textbooks','Question bank (QBank)','Own notes','Previous-year papers','Mock test series','Flashcards'];
// Add a new exam by adding one entry here: name, subjects, suggested full-mock length in minutes.
const EX={
 neetpg:{n:'NEET PG',mock:210,sub:['Anatomy','Physiology','Biochemistry','Pathology','Pharmacology','Microbiology','Forensic Medicine','Community Medicine (PSM)','Medicine','Surgery','Obstetrics & Gynaecology','Paediatrics','ENT','Ophthalmology','Orthopaedics','Dermatology','Psychiatry','Radiology','Anaesthesia']},
 sscgl:{n:'SSC CGL',mock:60,sub:['Quantitative Aptitude','Reasoning','English','General Awareness']},
 upsc:{n:'UPSC CSE',mock:240,sub:['Polity','History','Geography','Economy','Environment','Science & Tech','Current Affairs','CSAT']},
 neetug:{n:'NEET UG',mock:200,sub:['Physics','Chemistry','Botany','Zoology']}};
const LK='aimsarthi:v1',fresh=()=>({p:{hours:4,workHrs:0,off:'',done:[],weak:[],res:[]},tasks:[],draft:null,sessions:[],timer:null,top:[]});
let S=null,ready=false,mode='local',ref=null,q=Promise.resolve(),sT,iv,tT,fromCloud=false;
let V={tab:'home',day:today(),wk:0,step:0,err:'',cal:today().slice(0,7),tt:'',st:'',lx:''};
const byId=id=>S.tasks.find(t=>t.id===id);
const doneMin=t=>t.status==='done'?t.mins:t.status==='partial'?Math.round(t.mins/2):0;
const remain=t=>t.status==='partial'?Math.max(5,t.mins-Math.round(t.mins/2)):t.mins;
const tasksOn=k=>S.tasks.filter(t=>t.date===k).sort((a,b)=>P[a.pri]-P[b.pri]||a.mins-b.mins);
const miss=()=>S.tasks.filter(t=>!t.resolved&&t.date<today()&&t.status!=='done');
const cap=()=>(+S.p.hours)*60;
const load=(k,x)=>sum(S.tasks.filter(t=>t.date===k),t=>t.mins)+((x&&x[k])||0);
const repl=t=>t.gen&&t.status==='todo'&&!t.history&&t.date>=today();
const wkDays=o=>{const d=pd(today());d.setDate(d.getDate()-(d.getDay()+6)%7+o*7);const s=dk(d);return[...Array(7)].map((_,i)=>addD(s,i))};
const chip=(a,k,v,on,l)=>`<button type="button" class="chip" data-a="${a}" data-k="${k}" data-v="${esc(v)}" aria-pressed="${!!on}">${esc(l||v)}</button>`;
const inp=(id,l,a)=>`<label for="${id}">${l}</label><input id="${id}" ${a}>`;

/* ---------- storage: private per-user doc in the artifact db, else this browser ---------- */
function setSt(t){V.st=t;const e=$('#st');if(e)e.textContent=t}
function ls(d){try{localStorage.setItem(LK,JSON.stringify(d));setSt('Saved on this device')}catch(e){setSt('Could not save: browser storage is unavailable.')}}
function save(){clearTimeout(sT);sT=setTimeout(flush,300)}
function flush(){q=q.then(async()=>{
 S.sessions=S.sessions.slice(-500);const data=JSON.parse(JSON.stringify(S));
 if(mode==='cloud'&&ref){try{await ref.set(data);setSt('Saved to your account')}
  catch(e){if(e&&e.code==='invalid_argument'){mode='local';ls(data);setSt('Saved on this device only (account storage is not allowed for you here)')}else setSt('Could not reach account storage. The next change will retry.')}}
 else ls(data)})}
async function boot(){
 render();
 try{if(window.claude){const[u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
  if(u&&d){const id=await u.id();ref=d.collection('data/users/'+id).doc('state');mode='cloud';const s=await ref.get();if(s.exists){S=JSON.parse(JSON.stringify(s.data()));fromCloud=true}}}}
 catch(e){ref=null;mode='local'}
 if(!S){try{S=JSON.parse(localStorage.getItem(LK)||'null')}catch(e){}}
 S=Object.assign(fresh(),S||{});S.p=Object.assign(fresh().p,S.p);
 ready=true;if(S.timer)startTick();
 if(mode==='cloud'&&!fromCloud&&S.p.onboarded)save();
 render()}

/* ---------- plan generation (plain rules, no API) ---------- */
function gen(p){
 const ex=EX[p.exam],t0=today(),N=Math.min(28,diff(t0,addD(p.examDate,-1))+1),c=(+p.hours)*60,pm=c*.8;
 const nb=Math.max(1,Math.round(pm/60)),bl=Math.max(20,Math.round(pm/nb/5)*5),weak=p.weak||[],dn=p.done||[];
 let core=ex.sub.filter(s=>!dn.includes(s));if(!core.length)core=ex.sub.slice();
 const qu=[...core,...core.filter(s=>weak.includes(s))],cnt={},out=[];let qi=0,cover=[];
 const mk=(date,s,t,m,pr,type)=>out.push({id:uid(),subject:s,topic:t,mins:m,pri:pr,date,type,status:'todo',gen:true});
 for(let i=0;i<N;i++){const d=addD(t0,i),k=i%7;if(k===0)cover=[];
  if(p.off!==''&&String(pd(d).getDay())===p.off)continue;
  if(k===5){[...new Set(cover)].slice(-nb).forEach(s=>mk(d,s,'Revision: high-yield notes and recall',bl,'Medium','revision'));
   if(dn.length)mk(d,dn[Math.floor(i/7)%dn.length],'Light revision of a completed subject',bl,'Low','revision')}
  else if(k===6){mk(d,'Mock test','Full-length mock for '+ex.n+' (adjust length to your paper)',ex.mock,'High','mock');mk(d,'Mock test','Analyse mistakes and note weak topics',60,'High','mock')}
  else for(let b=0;b<nb;b++){const s=qu[qi++%qu.length];cnt[s]=(cnt[s]||0)+1;cover.push(s);mk(d,s,'Core concepts and MCQs, part '+cnt[s],bl,weak.includes(s)?'High':'Medium','study')}}
 return{start:t0,tasks:out,at:new Date().toISOString()}}

/* ---------- onboarding ---------- */
function chk(s){const p=S.p;
 if(s===1){const n=(p.name||'').trim();return n&&n.length<=40?'':'Enter your name (up to 40 characters).'}
 if(s===2)return EX[p.exam]?'':'Choose an exam.';
 if(s===3){if(!okD(p.examDate))return'Enter a valid exam date.';const n=diff(today(),p.examDate);if(n<2)return'The exam date must be at least 2 days from today.';if(n>1100)return'The exam date must be within about 3 years.';const t=(p.target||'').trim();return t&&t.length<=80?'':'Enter a target score or rank (up to 80 characters).'}
 if(s===4){const h=+p.hours,w=+p.workHrs;if(!(h>=.5&&h<=16))return'Daily study hours must be between 0.5 and 16.';return w>=0&&w<=16?'':'Work hours must be between 0 and 16.'}
 if(s===5)return p.level?'':'Choose your current level.';
 if(s===6)return(p.resOther||'').length>120?'Keep other resources under 120 characters.':'';
 return''}
function wiz(){const p=S.p,s=V.step;
 if(!s)return`<section><div class="road lg" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="partial"></i><i class="done"></i><i></i><i></i><i></i></div><h1 class="logo">AimSarthi</h1><p class="lead">Your study guide from today to exam day. Build a realistic roadmap, track study time, keep a streak, and recover from missed days without piling everything onto tomorrow.</p><p class="note">Built first for NEET PG aspirants who are also doing an internship. SSC CGL, UPSC CSE and NEET UG are included too. Plans are suggestions from your answers, not verified advice, and cannot promise any score or rank.</p><button class="btn w" style="margin-top:16px" data-a="next">Get started</button></section>`;
 const T=['','Create your profile','Choose your exam','Exam date and target','Daily time and commitments','Where you stand','Study resources'][s];let b='';
 if(s===1)b=`<p class="note">${mode==='cloud'?'You are signed in with your Claude account. Your plan is saved privately to that account and AimSarthi never sees a password.':'There are no accounts in this version, so your plan is saved on this device only. Clearing browser data erases it. When you return, your saved plan loads automatically.'}</p>`+inp('w_n','Your name',`data-f="name" maxlength="40" autocomplete="given-name" value="${esc(p.name||'')}"`);
 if(s===2)b=`<div class="chips">${Object.keys(EX).map(k=>chip('pick','exam',k,p.exam===k,EX[k].n)).join('')}</div><p class="sm mu" style="margin-top:8px">NEET PG is the pilot focus. Other exams use the same planner with their own subject lists.</p>`;
 if(s===3)b=inp('w_d','Exam date',`type="date" data-f="examDate" min="${addD(today(),2)}" max="${addD(today(),1100)}" value="${esc(p.examDate||'')}"`)+inp('w_t','Target score or rank',`data-f="target" maxlength="80" placeholder="For example: rank under 2,000" value="${esc(p.target||'')}"`)+'<p class="sm mu" style="margin-top:8px">Your target is for motivation. It does not change what is possible.</p>';
 if(s===4)b=inp('w_h','Hours per day you can study (0.5 to 16)',`type="number" inputmode="decimal" step="0.5" min="0.5" max="16" data-f="hours" value="${esc(p.hours)}"`)+inp('w_w','Internship or work hours per day',`type="number" inputmode="decimal" step="0.5" min="0" max="16" data-f="workHrs" value="${esc(p.workHrs)}"`)+`<label for="w_o">Weekly day off</label><select id="w_o" data-f="off"><option value="">No fixed day off</option>${DOW.map((d,i)=>`<option value="${i}" ${p.off===String(i)?'selected':''}>${d}</option>`).join('')}</select>`+inp('w_c','Commitment notes (optional)',`data-f="workNote" maxlength="120" placeholder="For example: night duty on Fridays" value="${esc(p.workNote||'')}"`);
 if(s===5)b=`<h3>Current level</h3><div class="chips" style="margin:8px 0">${['Beginner','Intermediate','Advanced'].map(l=>chip('pick','level',l,p.level===l)).join('')}</div><h3>Subjects completed</h3><div class="chips" style="margin:8px 0">${EX[p.exam].sub.map(x=>chip('tg','done',x,(p.done||[]).includes(x))).join('')}</div><h3>Subjects needing improvement</h3><div class="chips" style="margin:8px 0">${EX[p.exam].sub.map(x=>chip('tg','weak',x,(p.weak||[]).includes(x))).join('')}</div>`;
 if(s===6)b=`<div class="chips">${RES.map(x=>chip('tg','res',x,(p.res||[]).includes(x))).join('')}</div>`+inp('w_r','Other resources (optional)',`data-f="resOther" maxlength="120" value="${esc(p.resOther||'')}"`);
 return`<div class="bar" role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${s}"><i style="width:${s/6*100}%"></i></div><h1 style="margin-top:16px">${T}</h1>${b}<p class="er" role="alert" style="margin-top:8px">${esc(V.err)}</p><div class="row"><button class="btn o" data-a="back">Back</button><button class="btn" style="flex:1" data-a="next">${s<6?'Continue':'Build my roadmap'}</button></div>`}

/* ---------- views ---------- */
function cal(){const[y,m]=V.cal.split('-').map(Number),f=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),off=(f.getDay()+6)%7;
 let c='MTWTFSS'.split('').map(x=>`<span class="wd" aria-hidden="true">${x}</span>`).join('')+'<span></span>'.repeat(off);
 for(let d=1;d<=n;d++){const k=y+'-'+pad(m)+'-'+pad(d),T=S.tasks.filter(t=>t.date===k),all=T.length&&T.every(t=>t.status==='done');
  c+=`<button class="cd${k===V.day?' sel':''}${k===today()?' now':''}" data-a="day" data-v="${k}" aria-label="${fD(k)}, ${T.length} tasks" aria-pressed="${k===V.day}">${d}<i class="${all?'ok':T.length?'has':''}"></i></button>`}
 return`<section class="card"><div class="row sp"><button class="btn o s" data-a="cm" data-v="-1" aria-label="Previous month">&lsaquo;</button><h2 style="margin:0">${f.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn o s" data-a="cm" data-v="1" aria-label="Next month">&rsaquo;</button></div><div class="grid7">${c}</div></section>`}
const tcard=t=>`<article class="card tk ${t.status}"><div class="row sp" style="align-items:flex-start"><div><b>${esc(t.subject)}</b><br>${esc(t.topic)}</div><button class="btn o s" data-a="del" data-id="${t.id}" aria-label="Delete task ${esc(t.subject)}">Delete</button></div><p class="sm mu" style="margin:6px 0 8px">${hm(t.mins)} · <span class="pri ${t.pri}">${t.pri} priority</span>${t.type!=='study'?' · '+(t.type==='mock'?'mock test':'revision'):''}${t.history?' · moved from '+fD(t.history[t.history.length-1].from):''}</p><div class="seg" role="group" aria-label="Task status">${[['done','Done'],['partial','Partial'],['incomplete','Not done']].map(([s,l])=>`<button data-a="st" data-id="${t.id}" data-v="${s}" aria-pressed="${t.status===s}">${l}</button>`).join('')}</div></article>`;
function act(){const a=new Set(),m={};S.tasks.forEach(t=>{if(t.doneDate&&(t.status==='done'||t.status==='partial'))a.add(t.doneDate)});S.sessions.forEach(x=>m[x.day]=(m[x.day]||0)+x.mins);for(const k in m)if(m[k]>=20)a.add(k);return a}
function dayMins(k){return sum(S.sessions.filter(x=>x.day===k),x=>x.mins)+(S.timer&&dk(new Date(S.timer.start))===k?Math.floor((Date.now()-new Date(S.timer.start))/6e4):0)}
function home(){
 const k=V.day,T=tasksOn(k),est=sum(T,t=>t.mins),dm=sum(T,doneMin),pc=est?Math.round(dm/est*100):0,n=diff(today(),S.p.examDate),M=miss(),a=act(),nd=T.filter(t=>t.status==='done').length;
 let st=0,c=today();if(!a.has(c))c=addD(c,-1);while(a.has(c)){st++;c=addD(c,-1)}

 sug:()=>{const M=miss().sort((a,b)=>P[a.pri]-P[b.pri]||(a.date<b.date?-1:1)),add={},pl=[],un=[];
  M.forEach(t=>{const r=remain(t);let m=r,d=bestDays(m,add)[0];if(!d&&r>30){m=Math.max(20,Math.round(r/2/5)*5);d=bestDays(m,add)[0]}
   if(d){add[d]=(add[d]||0)+m;pl.push({id:t.id,d,m,r})}else un.push(t)});V.pl=pl;
  sheet(`<h2>Suggested recovery plan</h2><p class="sm mu">A suggestion only. Nothing moves until you accept.</p>`+(pl.length?pl.map(x=>{const t=byId(x.id);return`<p><b>${esc(t.subject)}</b>: ${esc(t.topic)}<br><span class="sm">${fD(t.date)} to <b>${fD(x.d)}</b>, ${hm(x.m)}${x.m<x.r?' (shortened from '+hm(x.r)+')':''}</span></p>`}).join('')+`<p class="sm"><b>Workload after:</b> ${Object.keys(add).sort().map(k=>fD(k)+' '+hm(load(k)+add[k])+' of '+hm(cap())).join('; ')}</p>`:'<p>No task fits the next two weeks without going over your daily limit.</p>')+(un.length?`<p class="sm">${un.length} not placed. Reschedule them yourself or dismiss them.</p>`:'')+`<div class="row"><button class="btn o" style="flex:1" data-a="x">Reject</button>${pl.length?'<button class="btn" style="flex:1" data-a="sugok">Accept plan</button>':''}</div>`)},
 sugok:()=>{const n=V.pl.length;V.pl.forEach(x=>moveT(byId(x.id),x.d,x.m));V.pl=[];closeSheet();save();render();toast(n+' task'+(n>1?'s':'')+' rescheduled')},
 wk:d=>{V.wk+=+d.v;render()},
 lx:d=>{V.lx=d.v;render()},
 te:()=>sheet(`<h2>Add a source-based entry</h2><p class="sm mu">Only record what the source states. Do not fill gaps from memory.</p>${inp('e_n','Candidate name','maxlength="60"')}${inp('e_y','Exam year',`type="number" inputmode="numeric" min="1990" max="${new Date().getFullYear()}"`)}${inp('e_d','Reported preparation duration','maxlength="60"')}${inp('e_r','Reported resources','maxlength="200"')}${inp('e_v','Revision approach','maxlength="200"')}${inp('e_s','Source (link or full citation)','maxlength="300"')}<p id="se" class="er" role="alert"></p><div class="row"><button class="btn o" data-a="x">Cancel</button><button class="btn" style="flex:1" data-a="teok">Save entry</button></div>`),
 teok:()=>{const g=i=>$(i).value.trim(),n=g('#e_n'),y=+g('#e_y'),s=g('#e_s');
  const e=!n?'Enter the candidate name.':!(Number.isInteger(y)&&y>=1990&&y<=new Date().getFullYear())?'Enter a valid exam year.':s.length<8?'Add a source link or full citation so others can verify it.':'';
  if(e){$('#se').textContent=e;return}
  S.top.push({id:uid(),exam:V.lx||S.p.exam,name:n,year:y,dur:g('#e_d'),res:g('#e_r'),rev:g('#e_v'),src:s,checked:false});closeSheet();save();render()},
 tc:d=>{const e=S.top.find(x=>x.id===d.id);e.checked=!e.checked;save();render()},
 tr:d=>{S.top=S.top.filter(x=>x.id!==d.id);save();render()},
 reset:()=>sheet(`<h2>Start over?</h2><p>This erases your profile, roadmap, tasks and study sessions.</p><div class="row"><button class="btn o" style="flex:1" data-a="x">Cancel</button><button class="btn" style="flex:1" data-a="resetok">Erase everything</button></div>`),
 resetok:()=>{S=fresh();V.step=0;V.tab='home';clearInterval(iv);closeSheet();save();render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset);else if(e.target.id==='sh')closeSheet()});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f,g=t.dataset.g;if(f&&S)S.p[f]=t.value;if(g==='rs')rsp();if(g==='tt')V.tt=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
boot();
</script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
